# Example nginx configuration: TLS-terminating, caching, compressing reverse
# proxy in front of the raindrop-public-browser Docker Compose stack.
#
# Adapt server_name, certificate paths, and the upstream address, then
# include this in your nginx http {} context (e.g. drop it into
# /etc/nginx/sites-enabled/ or conf.d/).

proxy_cache_path /var/cache/nginx/raindrop-public-browser
    levels=1:2 keys_zone=raindrop_public_browser:10m
    max_size=200m inactive=7d use_temp_path=off;

upstream raindrop_public_browser {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bookmarks.example.com;

    ssl_certificate     /etc/letsencrypt/live/bookmarks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmarks.example.com/privkey.pem;

    # Response compression. The app itself does not compress responses.
    gzip on;
    gzip_types text/html text/plain text/css application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    location / {
        proxy_pass http://raindrop_public_browser;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache what the app allows (it sends Cache-Control on everything:
        # pages are public/max-age=300, covers are immutable, search and
        # status are no-store) and revalidate cheaply via ETag.
        proxy_cache raindrop_public_browser;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bookmarks.example.com;
    return 301 https://$host$request_uri;
}
