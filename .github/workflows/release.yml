name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  meta:
    name: Derive release metadata
    runs-on: ubuntu-latest
    outputs:
      bin_name: ${{ github.event.repository.name }}
      bin_version: ${{ steps.version.outputs.bin_version }}
      dockerhub_owner: ${{ github.repository_owner }}
      ghcr_owner: ${{ github.repository_owner }}
      is_rolling_tag_update: ${{ steps.rolling.outputs.is_rolling_tag_update }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
      is_release: ${{ steps.release.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: echo "bin_version=$(./.version.sh)" >> "$GITHUB_OUTPUT"

      - name: Detect rolling-tag update
        id: rolling
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+(\.[0-9]+)?$ ]]; then
            echo "is_rolling_tag_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rolling_tag_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect prerelease
        id: prerelease
        run: |
          if [[ "$GITHUB_REF" == *"-alpha."* || "$GITHUB_REF" == *"-beta."* || "$GITHUB_REF" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect full release
        id: release
        run: |
          if [[ "${{ steps.rolling.outputs.is_rolling_tag_update }}" == "false" && "${{ steps.prerelease.outputs.is_prerelease }}" == "false" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: meta
    if: needs.meta.outputs.is_rolling_tag_update == 'false'
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    needs: meta
    if: needs.meta.outputs.is_rolling_tag_update == 'false'
    uses: ./.github/workflows/test.yml

  docker:
    name: Docker images
    needs: [meta, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ needs.meta.outputs.dockerhub_owner }}/${{ needs.meta.outputs.bin_name }}
            ghcr.io/${{ needs.meta.outputs.ghcr_owner }}/${{ needs.meta.outputs.bin_name }}
          tags: |
            type=raw,value=latest,enable=${{ needs.meta.outputs.is_release == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            BIN_VERSION=${{ needs.meta.outputs.bin_version }}

      - name: Update Docker Hub description
        if: needs.meta.outputs.is_release == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ needs.meta.outputs.dockerhub_owner }}/${{ needs.meta.outputs.bin_name }}

  release:
    name: GitHub release
    needs: [meta, docker]
    if: needs.meta.outputs.is_release == 'true' || needs.meta.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

  tags:
    name: Update rolling release tags
    needs: [meta, release]
    if: needs.meta.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update vX and vX.Y tags
        uses: sersoft-gmbh/running-release-tags-action@v4
        with:
          fail-on-non-semver-tag: true
          create-release: false
          update-full-release: false
