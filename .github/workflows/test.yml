name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release calls this workflow so a tag can't ship code that fails tests.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...
